# Brutor Demo System: the four demo containers (DESIGN.md section 5.6).
#
# All services join the external docker network of a running Brutor Agent
# Control (Community Edition or Enterprise; `brutor-network`, or the name in
# BRUTOR_NETWORK) and address the gateway as http://core:8100. The gateway
# addresses them by container name. Host publishing is loopback only.
#
# `.demo.env` is written by setup.py (server ids, model names, and the API keys
# of the development-stage walkthrough). The screening agent is behind the
# `agent` profile so `demo.sh up` can start the MCP servers and the fraud agent
# first, provision, and only then start it.
#
# Workload identity: SPIRE (server, agent, OIDC Discovery Provider) issues each
# agent a JWT-SVID with audience `brutor`; the agents present it to the gateway
# as their Bearer credential. Configuration and the join-token fallback are in
# spire/README.md. Images are pinned by version and digest.

name: brutor-demo-system

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
    container_name: brutor-demo-spire-server
    restart: unless-stopped
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - brutor-demo-spire-server-data:/run/spire/server
      - brutor-demo-spire-server-socket:/tmp/spire-server/private
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - brutor-network

  # Publishes the server's JWT signing keys; the gateway reads them at
  # http://brutor-demo-spire-oidc:8008/keys (the IdP's jwks_uri).
  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.15.5@sha256:8889641f0eaec84bb42ea1445dff71c0a6a2cfd2a3cfbbee63d17578aaaec7fc
    container_name: brutor-demo-spire-oidc
    restart: unless-stopped
    command: ["-config", "/opt/spire/conf/oidc-discovery-provider.conf"]
    ports:
      - "127.0.0.1:${SPIRE_OIDC_HOST_PORT:-9208}:8008"
    volumes:
      - ./spire/oidc-discovery-provider.conf:/opt/spire/conf/oidc-discovery-provider.conf:ro
      - brutor-demo-spire-server-socket:/tmp/spire-server/private
    depends_on:
      spire-server:
        condition: service_healthy
    networks:
      - brutor-network

  # Attests the demo agents. The docker workload attestor reads the calling
  # process's container through the Docker socket (read-only), and needs the
  # host's process table to map the caller to its container. Without the
  # socket, see the join-token and unix-attestor fallback in spire/README.md.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.5@sha256:3652c732b0f0d36f4dd78394230a1b1cd0ddcc29548a46c67a996b1a78c14481
    container_name: brutor-demo-spire-agent
    restart: unless-stopped
    pid: host
    # The join token is single-use and expires within minutes; demo.sh
    # generates it on the server and passes it only for the first start.
    # Once attested, the agent renews its own identity from its data volume.
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN:-}"]
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spire/runtime:/run/spire/bundle:ro
      - brutor-demo-spire-agent-data:/var/lib/spire/agent
      - brutor-demo-spire-agent-socket:/tmp/spire-agent/public
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      spire-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - brutor-network

  applications-mcp:
    build: ../brutor-demo-applications-mcp
    image: brutor-demo-applications-mcp:local
    container_name: brutor-demo-applications-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APPLICATIONS_HOST_PORT:-3014}:3014"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3014"
      DATA_DIR: /data
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      GENERATE_INTERVAL_SECONDS: "${GENERATE_INTERVAL_SECONDS:-600}"
      GENERATE_MIN_PER_INTERVAL: "${GENERATE_MIN_PER_INTERVAL:-2}"
      GENERATE_MAX_PER_INTERVAL: "${GENERATE_MAX_PER_INTERVAL:-3}"
      GENERATOR_SEED: "${GENERATOR_SEED:-20260923}"
    volumes:
      - brutor-demo-applications-data:/data
    networks:
      - brutor-network

  credit-bureau-mcp:
    build: ../brutor-demo-credit-bureau-mcp
    image: brutor-demo-credit-bureau-mcp:local
    container_name: brutor-demo-credit-bureau-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BUREAU_HOST_PORT:-3015}:3015"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3015"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    networks:
      - brutor-network

  fraud-screener-agent:
    build:
      context: ../brutor-demo-fraud-screener-agent
      args:
        # The release's build id (e.g. the git SHA), baked into the image and
        # sent as X-Brutor-Agent-Build. Empty = no build header.
        BRUTOR_AGENT_BUILD: "${BRUTOR_AGENT_BUILD:-}"
    image: brutor-demo-fraud-screener-agent:local
    container_name: brutor-demo-fraud-screener-agent
    restart: unless-stopped
    # The SPIRE registration entry for this agent selects this label.
    labels:
      io.brutor.demo.workload: fraud-screener-agent
    ports:
      - "127.0.0.1:${FRAUD_HOST_PORT:-9200}:9200"
    env_file:
      - path: .demo.env
        required: false
    environment:
      A2A_PORT: "9200"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # The credential is a JWT-SVID from the SPIRE Agent's Workload API.
      # BRUTOR_CREDENTIAL=api_key (in .demo.env, development stage only)
      # switches to the key in FRAUD_BRUTOR_API_KEY instead.
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/api.sock
      BRUTOR_GATEWAY_URL: http://core:8100
      BRUTOR_TENANT_ID: "${BRUTOR_TENANT_ID:-default}"
      A2A_PUBLIC_URL: http://brutor-demo-fraud-screener-agent:9200
      CLASSIFIER_MODEL: "${CLASSIFIER_MODEL:-gpt-5.2}"
    volumes:
      - brutor-demo-spire-agent-socket:/run/spire/sockets:ro
    networks:
      - brutor-network

  screening-agent:
    build:
      context: ../brutor-demo-screening-agent
      args:
        # The release's build id (e.g. the git SHA), baked into the image and
        # sent as X-Brutor-Agent-Build. Empty = no build header.
        BRUTOR_AGENT_BUILD: "${BRUTOR_AGENT_BUILD:-}"
    image: brutor-demo-screening-agent:local
    container_name: brutor-demo-screening-agent
    restart: unless-stopped
    labels:
      io.brutor.demo.workload: screening-agent
    profiles:
      - agent
    ports:
      - "127.0.0.1:${SCREENING_HOST_PORT:-9201}:9201"
    # demo.sh start refuses to run with an empty .demo.env; here it is optional
    # so `docker compose config` and `demo.sh status` work before provisioning.
    env_file:
      - path: .demo.env
        required: false
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/api.sock
      BRUTOR_GATEWAY_URL: http://core:8100
      DATA_DIR: /data
      # Re-raises of a lapsed underwriter hold (0 = unlimited). Each re-raise is
      # an escalated one-action run.
      RERAISE_MAX: "${RERAISE_MAX:-0}"
      HEALTH_PORT: "9201"
      TICK_SECONDS: "${TICK_SECONDS:-600}"
      MAX_PER_TICK: "${MAX_PER_TICK:-5}"
      CLASSIFIER_API: "${CLASSIFIER_API:-chat}"
      DRAFTER_API: "${DRAFTER_API:-responses}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - brutor-demo-agent-data:/data
      - brutor-demo-spire-agent-socket:/run/spire/sockets:ro
    depends_on:
      - applications-mcp
      - credit-bureau-mcp
      - fraud-screener-agent
    networks:
      - brutor-network

volumes:
  brutor-demo-applications-data:
  brutor-demo-agent-data:
  brutor-demo-spire-server-data:
  brutor-demo-spire-server-socket:
  brutor-demo-spire-agent-data:
  brutor-demo-spire-agent-socket:

networks:
  brutor-network:
    external: true
    name: ${BRUTOR_NETWORK:-brutor-network}
