# SPIRE OIDC Discovery Provider: publishes the server's JWT signing keys at
# /keys and the discovery document at /.well-known/openid-configuration.
# The Core Gateway fetches the keys from http://brutor-demo-spire-oidc:8008/keys.
#
# Plain HTTP inside the docker network, for the demo only. A real deployment
# serves it over HTTPS (acme or serving_cert_file) at a public name.
log_level = "INFO"
domains = ["brutor-demo-spire-oidc", "localhost", "127.0.0.1"]
allow_insecure_scheme = true
insecure_addr = ":8008"

server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}

health_checks {
    bind_port = "8009"
    live_path = "/live"
    ready_path = "/ready"
}
