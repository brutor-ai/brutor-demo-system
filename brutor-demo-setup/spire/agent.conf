# SPIRE Agent of the Brutor Demo System.
#
# The agents reach its Workload API over the unix socket in the shared volume
# (SPIFFE_ENDPOINT_SOCKET). It attests each caller with the docker workload
# attestor: the calling process's container, read through the Docker socket,
# must carry the label `io.brutor.demo.workload` that a registration entry
# names. Nothing the caller says about itself counts.
agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    server_address = "brutor-demo-spire-server"
    server_port = "8081"
    socket_path = "/tmp/spire-agent/public/api.sock"
    # The server's CA bundle, written by demo.sh from `spire-server bundle show`.
    trust_bundle_path = "/run/spire/bundle/bundle.pem"
    trust_domain = "borealis.example"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }
    WorkloadAttestor "docker" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "127.0.0.1"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
