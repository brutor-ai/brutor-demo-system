# SPIRE Agent of the Brutor Demo System, unix workload attestor (the fallback
# without the Docker socket; spire/README.md).
#
# The agents reach its Workload API over the unix socket in the shared volume
# (SPIFFE_ENDPOINT_SOCKET). It attests each caller by the user id of the
# calling process, which the kernel reports for the socket: the screening agent
# runs as 10101 and the fraud screener as 10102 (their Dockerfiles), and a
# registration entry names each. Nothing the caller says about itself counts.
agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    server_address = "brutor-demo-spire-server"
    server_port = "8081"
    socket_path = "/tmp/spire-agent/public/api.sock"
    # The server's CA bundle, written by demo.sh from `spire-server bundle show`.
    trust_bundle_path = "/run/spire/bundle/bundle.pem"
    trust_domain = "borealis.example"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "127.0.0.1"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
