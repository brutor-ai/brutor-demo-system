# SPIRE Server of the Brutor Demo System: the demo's own trust domain.
#
# It signs the agents' JWT-SVIDs (audience `brutor`) with keys the OIDC
# Discovery Provider publishes, so the Core Gateway verifies them like any
# OIDC workload token. `jwt_issuer` is the `iss` of every JWT-SVID and must
# equal the issuer setup.py registers (SPIRE_OIDC_ISSUER).
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "borealis.example"
    data_dir = "/run/spire/server/data"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
    # A JWT-SVID lives five minutes; the agents fetch a fresh one before it expires.
    default_jwt_svid_ttl = "5m"
    jwt_issuer = "http://brutor-demo-spire-oidc:8008"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/server/data/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/server/data/keys.json"
        }
    }
    # The node (the SPIRE Agent's host) proves itself with a one-time join
    # token that demo.sh generates on this server. A cloud or Kubernetes
    # deployment uses its platform's node attestor instead.
    NodeAttestor "join_token" {
        plugin_data {}
    }
}

health_checks {
    listener_enabled = true
    bind_address = "127.0.0.1"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
