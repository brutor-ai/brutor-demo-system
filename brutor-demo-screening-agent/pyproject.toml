[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brutor-demo-screening-agent"
version = "0.3.0"
description = "Brutor Demo System: LangGraph loan pre-screening agent that runs every governed action through the Core Gateway."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph>=0.2,<2",
    "openai>=1.40,<3",
    "httpx>=0.27,<1",
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
    # The SPIFFE Workload API client (Apache-2.0): fetches the agent's JWT-SVID.
    "spiffe>=0.4,<0.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
screening-agent = "screening_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["screening_agent*"]

# The declared outcome catalogue ships inside the package.
[tool.setuptools.package-data]
screening_agent = ["outcomes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
