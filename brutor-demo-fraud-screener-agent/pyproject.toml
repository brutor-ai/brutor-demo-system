[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brutor-demo-fraud-screener-agent"
version = "0.1.0"
description = "Brutor Demo System: mock Fraud and Sanctions Screener, an A2A remote agent that echoes the gateway's delegation chain on its own model call."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
fraud-screener = "fraud_screener.__main__:main"

[tool.setuptools.packages.find]
include = ["fraud_screener*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
