[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brutor-demo-credit-bureau-mcp"
version = "0.1.0"
description = "Mock KYC and credit reference agency for the Brutor Demo System, exposed as an MCP server (FastMCP, streamable HTTP, stateless)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# mcp 2.x renamed FastMCP to MCPServer and changed the transport API; the design
# names the FastMCP API, so stay on the 1.x line.
dependencies = [
    "mcp>=1.10,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
brutor-demo-credit-bureau-mcp = "credit_bureau_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
